<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RadarBets - Novo Bilhete</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topo">

<h1>🎫 Novo Bilhete</h1>

<p>Monte seu bilhete de apostas</p>

</header>

<div class="container">

<!-- ==========================
     NOVA SELEÇÃO
========================== -->

<div class="card">

<h2>➕ Nova Seleção</h2>

<label>📅 Data</label>

<input
id="data"
type="date">

<label>⚽ Jogo</label>

<input
id="jogo"
type="text"
placeholder="Ex.: Flamengo x Palmeiras">

<label>🏆 Campeonato</label>

<input
id="campeonato"
type="text"
placeholder="Brasileirão Série A">

<label>🎯 Mercado</label>

<select id="mercado">

<option value="">Selecione...</option>

<option>Over 0.5 HT</option>
<option>Over 1.5</option>
<option>Over 2.5</option>
<option>Over 3.5</option>
<option>BTTS</option>
<option>Under 2.5</option>
<option>Under 3.5</option>
<option>Dupla Chance</option>
<option>Empate Anula</option>
<option>Escanteios</option>
<option>Cartões</option>
<option>Outro</option>

</select>

<label>📈 Odd da Seleção</label>

<input
id="odd"
type="number"
step="0.01"
placeholder="1.80">

<br><br>

<button id="btnAdicionar">

➕ Adicionar ao Bilhete

</button>

</div>

<!-- ==========================
     BILHETE
========================== -->

<div class="card">

<h2>🎫 Bilhete em Montagem</h2>

<div id="listaBilhete">

<p style="text-align:center;color:#888;">

Nenhuma seleção adicionada.

</p>

</div>

</div>

<!-- ==========================
     DADOS DO BILHETE
========================== -->

<div class="card">

<h2>📋 Dados do Bilhete</h2>

<p>

Quantidade de Seleções:

<strong id="qtdSelecoes">0</strong>

</p>

<label>📈 Odd Final</label>

<input
id="oddFinal"
type="number"
step="0.01"
placeholder="Digite a odd final">

<label>💵 Valor Apostado</label>

<input
id="valor"
type="number"
step="0.01"
placeholder="50.00">

<label>🏦 Casa de Apostas</label>

<input
id="casa"
type="text"
placeholder="Betano">

<label>📝 Observações</label>

<textarea
id="observacao"
rows="4"
placeholder="Observações..."></textarea>

</div>

<!-- ==========================
     RESUMO
========================== -->

<div class="card">

<h2>💰 Resumo</h2>

<p>

Retorno Previsto

</p>

<h2 id="retornoPrevisto">

R$ 0,00

</h2>

</div>

<!-- ==========================
     SALVAR
========================== -->

<div class="card">

<button id="btnSalvarBilhete">

💾 Salvar Bilhete

</button>

</div>

</div>

</body>
