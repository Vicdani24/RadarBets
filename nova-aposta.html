<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RadarBets - Nova Aposta</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topo">

<h1>🎯 Nova Aposta</h1>

<p>Cadastre uma nova aposta</p>

</header>

<div class="container">

<div class="card">

<h2>📝 Informações da Aposta</h2>

<label>📅 Data</label>

<input
id="data"
type="date">

<label>⚽ Jogo</label>

<input
id="jogo"
type="text"
placeholder="Ex.: Flamengo x Palmeiras">

<label>🏆 Campeonato</label>

<input
id="campeonato"
type="text"
placeholder="Brasileirão Série A">

<label>🎯 Mercado</label>

<select id="mercado">

<option value="">Selecione...</option>

<option>Over 0.5 HT</option>
<option>Over 1.5</option>
<option>Over 2.5</option>
<option>Over 3.5</option>
<option>BTTS</option>
<option>Under 2.5</option>
<option>Under 3.5</option>
<option>Dupla Chance</option>
<option>Empate Anula</option>
<option>Escanteios</option>
<option>Cartões</option>
<option>Outro</option>

</select>

<label>📈 Odd</label>

<input
id="odd"
type="number"
step="0.01"
placeholder="1.80">

<label>💵 Valor Apostado</label>

<input
id="valor"
type="number"
step="0.01"
placeholder="50.00">

<label>🏦 Casa de Aposta</label>

<input
id="casa"
type="text"
placeholder="Betano">

<label>📝 Observações</label>

<textarea
id="observacao"
rows="4"
placeholder="Observações da aposta..."></textarea>

</div>

<div class="card">

<button id="btnSalvarAposta">

💾 Salvar Aposta

</button>

</div>

</div>
